<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function clicou() {
            s = window.document.getElementById('saida')
            s.innerHTML += <p>Você clicou na saida</p>
        }
    </script>
</head>
<body>
    <a href="#" onclick="clicou()">Clica ae namoral</a>
    <div id="saida"></div>
</body>
</html>
