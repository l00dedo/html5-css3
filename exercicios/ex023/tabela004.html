<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body {
            height: 100vh;
            margin: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        td, th {
            border: 2.5px solid black;
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 900px;
            height: 500px;
            margin: auto;
        }
    </style>
</head>
<body>
    <table>

        <caption>Fimes Favoritos</caption>

        <thead>
            <tr>
               <th>Grupo</th> 
               <th>Nome</th>
               <th colspan="3">Filmes</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="3">Mulheres</th>
                <td>Name1</td>
                <td>Movie1</td>
                <td>Movie2</td>
                <td>Movie3</td>
            </tr>

            <tr>
                <td>Name2</td>
                <td>Movie1</td>
                <td>Movie2</td>
                <td>Movie3</td>
            </tr>

            <tr>
                <td>Name3</td>
                <td>Movie1</td>
                <td>Movie2</td>
                <td>Movie3</td>               
            </tr>

            <tr>
                <th rowspan="3">Homens</th>
                <td>Name1</td>
                <td>Movie1</td>
                <td>Movie2</td>
                <td>Movie3</td>
            </tr>

            <tr>
                <td>Name2</td>
                <td>Movie1</td>
                <td>Movie2</td>
                <td>Movie3</td>
            </tr>

            <tr>
                <td>Name3</td>
                <td>Movie1</td>
                <td>Movie2</td>
                <td>Movie3</td>
            </tr>
        </tbody>

    </table>
</body>
</html>
